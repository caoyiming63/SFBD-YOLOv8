nc: 3  # number of classes
scales:
  # [depth, width, max_channels]
  n: [0.33, 0.25, 1024]
  s: [0.33, 0.50, 1024]
  m: [0.67, 0.75, 768]
  l: [1.00, 1.00, 512]
  x: [1.00, 1.25, 512]
fusion_mode: bifpn
node_mode: C2f
head_channel: 256

# YOLOv8.0n backbone
backbone:
  # [from, repeats, module, args]
  - [-1, 1, Conv, [64, 3, 2]] # 0-P1/2
  - [-1, 1, Conv, [128, 3, 2]] # 0-P1/2
  - [-1, 3, C2f, [128, True]] #2
  - [-1, 1, Conv, [256, 3, 2]] # 0-P1/2
  - [-1, 6, C2f_Faster, [256, True]]
  - [-1, 1, DynamicShuffleUnit, [512,  2]]
  - [-1, 6, C2f_Faster, [512, True]]
  - [-1, 1, DynamicShuffleUnit, [1024,  2]]
  - [-1, 3, C2f, [1024, True]]
  - [-1, 1, SPPF, [1024, 5]] #9

# YOLOv8.0n head
head:
  - [ 2, 1, Conv, [256, 3, 2] ] #10  80*80
  - [ 4, 1, Conv, [256, 1, 1] ] #11  80*80
  - [ 6, 1, Conv, [256, 1, 1] ] #12  40*40
  - [ 9, 1, Conv, [256, 1, 1] ] #13  20*20

  - [-1, 1, DySample, [2, 4]] #14
  - [ [ -1, 12 ], 1, Fusion, [ fusion_mode ] ] #15   256,40*40
  - [-1, 3, C2f, [256]]  #16

  - [-1, 1, DySample, [2, 4]] #17
  - [ [ -1, 11 ], 1, Fusion, [ fusion_mode ] ] #18   256 80*80
  - [-1, 3, C2f, [256]] #19

  - [ [ -1,10, 11 ], 1, Fusion, [ fusion_mode ] ] #20
  - [-1, 3, C2f, [256]] #21

  - [ -1, 1, Conv, [ 256, 3, 2 ] ] #22

  - [ [ -1, 12 ,16], 1, Fusion, [ fusion_mode ] ] #23 256,40*40
  - [-1, 3, C2f, [256]] #24

  - [ -1, 1, Conv, [ 256, 3, 2 ] ] #25
  - [ [ -1, 13], 1, Fusion, [ fusion_mode ] ] #26 256,20*20
  - [-1, 3, C2f, [256]] #27


  - [ [ 21, 24, 27], 1, Detect, [ nc ] ]  # Detect
